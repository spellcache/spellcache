name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NEXT_TELEMETRY_DISABLED: 1

jobs:
  checks:
    name: Lint, typecheck, tests, build
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: spellcache
          POSTGRES_PASSWORD: spellcache
          POSTGRES_DB: spellcache_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U spellcache"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Base fournie par le service ci-dessus : le setup des tests
      # d'intégration la migre sans lancer Docker Compose.
      TEST_DATABASE_URL: postgres://spellcache:spellcache@localhost:5433/spellcache_test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      # Le test de sauvegarde et restauration utilise pg_dump/psql : ils
      # doivent être de la même version majeure que le serveur (17), plus
      # récente que celle du runner.
      - name: Install PostgreSQL 17 client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-common
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y postgresql-client-17
          echo "/usr/lib/postgresql/17/bin" >> "$GITHUB_PATH"
      - run: pnpm install --frozen-lockfile
      # Les tests de hauteur de ligne rendent les composants dans un vrai
      # Chromium (Playwright) : le navigateur doit être installé ici aussi.
      - run: pnpm --filter @spellcache/web exec playwright install --with-deps chromium
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  docker:
    name: Docker image (${{ matrix.app }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [web, worker]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/${{ matrix.app }}/Dockerfile
          push: false
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,mode=max,scope=${{ matrix.app }}

  android:
    name: Android app (debug build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      # Le SDK Android est préinstallé sur les runners ubuntu-latest ; seul le
      # JDK est fixé, à la version attendue par Capacitor 8.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
      - run: pnpm install --frozen-lockfile --filter @spellcache/android
      - run: pnpm --filter @spellcache/android sync
      - run: ./gradlew assembleDebug --no-daemon
        working-directory: apps/android/android

  e2e:
    name: Playwright
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: spellcache
          POSTGRES_PASSWORD: spellcache
          POSTGRES_DB: spellcache
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U spellcache"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: valkey/valkey:8-alpine
        ports:
          - 6379:6379
    env:
      CI: true
      DATABASE_URL: postgres://spellcache:spellcache@localhost:5432/spellcache
      REDIS_URL: redis://localhost:6379
      # Valeurs de test, propres à cette base jetable.
      AUTH_SECRET: ci-only-secret-not-used-anywhere-else
      AUTH_URL: http://localhost:3000
      AUTH_TRUST_HOST: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:migrate
      - run: pnpm --filter @spellcache/web exec playwright install --with-deps chromium
      # Build de production servi par `pnpm start` (playwright.config.ts).
      - run: pnpm --filter @spellcache/web build
      - run: pnpm test:e2e
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/web/playwright-report
          retention-days: 7
