name: Docs

on:
  pull_request:
    paths:
      - docs/**
      - apps/docs/**
      - .env.example
      - CHANGELOG.md
      - design/assets/icon/**
      - pnpm-lock.yaml
      - .github/workflows/docs.yml
  # Même liste : les pages incluent .env.example et CHANGELOG.md, qu'une
  # release modifie sans toucher à docs/.
  push:
    branches: [main]
    paths:
      - docs/**
      - apps/docs/**
      - .env.example
      - CHANGELOG.md
      - design/assets/icon/**
      - pnpm-lock.yaml
      - .github/workflows/docs.yml
  workflow_dispatch:

permissions:
  contents: read

# Un seul déploiement Pages à la fois ; celui en cours va jusqu'au bout plutôt
# que de laisser le site à moitié publié.
concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Historique complet : la date « Last updated » de chaque page vient
          # de `git log`.
          fetch-depth: 0
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile --filter @spellcache/docs
      - run: pnpm --filter @spellcache/docs build
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: apps/docs/dist

  deploy:
    name: Deploy
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
